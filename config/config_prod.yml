COMMONINFO:
  regional_object: gcm-prod
NATS: # в основном используется для обогащения данных доп. информацией
  host: nats.cloud.gcm
  port: 4222
  cache_ttl: 3600
  subscriptions:
    some: somesubscription
  enriching_queries:
    get_geoip_info: object.geoip-request
    get_sensor_info: object.sensor-info-request
KAFKA: # приём информации для её последующей обработки
  host: 192.168.9.73
  port: 30932
  cache_ttl: 3600
  group_id: "" # для ГЦМ оставляем пустым
  topics:
    alerts: alertmgr-alerts
    cases: socd-soar-prod-issue-v1
  sasl_mechanism: SCRAM-SHA-512 # PLAIN, SCRAM-SHA-256, SCRAM-SHA-512
  ssl_username: siem2
  ssl_ca_file: "/secrets/truststore.jks" # ca.crt или truststore.jks # ca.crt или truststore.jks (определяет набор корневых центров сертификации которые клиенты используют при проверке сертификатов сервера)
  ssl_cert_file: # client.crt открытый сертификат клиента
  ssl_key_file: # client.key закрытый ключ для сертификата клиента
  # если ssl_ca_file, ssl_cert_file и ssl_key_file пустые то будут выполнятся поппытки соединения с сервером
  # kafka без использования протокола TLS
  ssl_server_name: "kafka-cluster-kafka-bootstrap" # имя сервера kafka указанное в сертификате клиента
DATABASESTORAGE: # хранилище принятой информации
  host: datahook.cloud.gcm
  port: 9200
  user: writer
  namedb: ""
  storage_name_db:
    alerts: module_placeholderdb_bizone_alerts
    case: module_placeholderdb_bizone_case
DATABASEWRITELOG: # хранилище логов работы модуля
  host: datahook.cloud.gcm
  port: 9200
  user: log_writer
  namedb: ""
  storage_name_db: module_placeholderdb_bizone
DEBUGSERVER:
  enable: false
  host: localhost
  port: 6565
