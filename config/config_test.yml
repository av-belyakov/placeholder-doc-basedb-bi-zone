COMMONINFO:
  regional_object: gcm-test
NATS:
  host: 192.168.9.208
  port: 4222
  cache_ttl: 3600
  subscriptions:
    some: somesubscription
  enriching_queries:
    get_geoip_info: object.geoip-request.test
    get_sensor_info: object.sensor-info-request.test
KAFKA:
  host: 192.168.9.73
  port: 32704
  cache_ttl: 3600
  group_id: spring.kafka.bootstrap.servers
  topics:
    alerts: alertmgr-alerts
    soar-alerts: socd-soar-prod-issue-v1
  sasl_mechanism: ANONYMOUS # PLAIN, SCRAM-SHA-256, SCRAM-SHA-512 или ANONYMOUS если аутентификации не требуется
  ssl_username: siem2
  ssl_ca_file: # ca.crt или truststore.jks # ca.crt или truststore.jks (определяет набор корневых центров сертификации которые клиенты используют при проверке сертификатов сервера)
  ssl_cert_file: # client.crt открытый сертификат клиента, параметр и только для тестов
  ssl_key_file: # client.key закрытый ключ для сертификата клиента, параметр и только для тестов
  # если ssl_ca_file, ssl_cert_file и ssl_key_file пустые то будут выполнятся поппытки соединения с сервером
  # kafka без использования протокола TLS
  ssl_server_name: kafka-cluster-kafka-bootstrap # имя сервера kafka указанное в сертификате клиента
