KAFKA:
  host: 192.168.9.73
  port: 30932
  cache_ttl: 3601
  group_id: "" # для ГЦМ оставляем пустым
  topics:
    alerts: alertmgr-alerts
    cases: socd-soar-prod-issue-v1
  sasl_mechanism: SCRAM-SHA-512 # PLAIN, SCRAM-SHA-256, SCRAM-SHA-512
  ssl_username: siem2
  ssl_ca_file: "/secrets/ca.crt" # ca.crt или truststore.jks (определяет набор корневых центров сертификации которые клиенты используют при проверке сертификатов сервера)
  ssl_cert_file: # client.crt открытый сертификат клиента
  ssl_key_file: # client.key закрытый ключ для сертификата клиента
  # если ssl_ca_file, ssl_cert_file и ssl_key_file пустые то будут выполнятся поппытки соединения с сервером
  # kafka без использования протокола TLS
  ssl_server_name: "kafka-cluster-kafka-bootstrap" # имя сервера kafka указанное в сертификате клиента
